<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFast - Unlock Your Potential</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">LearnFast</div>
            <div class="nav-links">
                <button class="nav-btn active" data-view="home">Home</button>
                <button class="nav-btn" data-view="search">Search</button>
                <button class="nav-btn" data-view="profile">Profile</button>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="am">AM</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Home View (Content Dashboard) -->
        <div id="home-view" class="view-section">
            <header class="hero-section">
                <h1 class="logo">Discover<span class="highlight">More</span></h1>
                <p class="tagline">Games, Videos, and Facts regarding knowledge.</p>
            </header>
            <section id="home-grid" class="results-grid">
                <!-- Preset content injected here -->
            </section>
        </div>

        <!-- Search View (AI Tool) -->
        <div id="search-view" class="view-section hidden">
            <header class="hero-section">
                <h1 class="logo">Learn<span class="highlight">Fast</span></h1>
                <p class="tagline" data-i18n="tagline">Learn anything, faster and easier.</p>
            </header>

            <main class="glass-card">
                <div class="search-box-container">
                    <h2 data-i18n="searchTitle">What do you want to learn?</h2>
                    <form id="learning-form">
                        <div class="input-group large-input">
                            <i class="fas fa-search icon"></i>
                            <input type="text" id="topic" data-i18n-placeholder="placeholder"
                                placeholder="Type a topic..." autocomplete="off">
                            <button type="submit" class="cta-button">
                                <i class="fas fa-magic"></i> <span data-i18n="btnSearch">Search</span>
                            </button>
                        </div>
                    </form>
                </div>
            </main>

            <section id="results-section" class="results-grid hidden">
                <!-- Results injected here -->
            </section>

            <div id="load-more-container" class="hidden">
                <button id="btn-load-more" class="cta-button" data-i18n="btnLoadMore">Load More</button>
            </div>
        </div>

        <!-- Profile View -->
        <div id="profile-view" class="view-section hidden">
            <!-- State 1: Sign In -->
            <div id="signin-container" class="glass-card full-center">
                <h2 data-i18n="profileHeader">Welcome, Learner!</h2>
                <p data-i18n="profileSub">Please sign in to personalize your journey.</p>
                <form id="signin-form">
                    <div class="input-group large-input">
                        <input type="text" id="username-input" data-i18n-placeholder="placeholderName"
                            placeholder="Enter your name" required autocomplete="off">
                        <button type="submit" class="cta-button" data-i18n="btnConfirm">Confirm</button>
                    </div>
                </form>
            </div>

            <!-- State 2: Quiz -->
            <div id="quiz-container" class="glass-card hidden">
                <div class="quiz-header">
                    <h2 id="quiz-question">Question 1</h2>
                    <div class="progress-bar">
                        <div id="quiz-progress"></div>
                    </div>
                </div>
                <div id="quiz-options" class="quiz-options-grid">
                    <!-- Options injected here -->
                </div>
            </div>

            <!-- State 3: Dashboard -->
            <div id="profile-dashboard" class="glass-card hidden">
                <div class="profile-header">
                    <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                    <div>
                        <h2 id="profile-name">User Name</h2>
                        <p class="profile-level">Level 1 Learner</p>
                    </div>
                </div>
                <hr style="border-color: rgba(255,255,255,0.1); margin: 1rem 0;">
                <div class="profile-stats">
                    <h3 data-i18n="dashboardHeader">Your Preferences</h3>
                    <ul id="preferences-list">
                        <!-- Preferences injected here -->
                    </ul>
                </div>
                <button id="logout-btn" class="cta-button secondary" data-i18n="btnSignOut">Sign Out</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
