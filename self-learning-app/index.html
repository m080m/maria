<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFast - Unlock Your Potential</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-logo">LearnFast</div>
            <div class="nav-links">
                <button class="nav-btn active" data-view="home">Home</button>
                <button class="nav-btn" data-view="explore">Explore</button>
            </div>
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="am">AM</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Home View (Search) -->
        <div id="home-view" class="view-section">
            <header class="hero-section">
                <h1 class="logo">Learn<span class="highlight">Fast</span></h1>
                <p class="tagline" data-i18n="tagline">Learn anything, faster and easier.</p>
            </header>

            <main class="glass-card">
                <div class="search-box-container">
                    <h2 data-i18n="searchTitle">What do you want to learn?</h2>
                    <form id="learning-form">
                        <div class="input-group large-input">
                            <i class="fas fa-search icon"></i>
                            <input type="text" id="topic" data-i18n-placeholder="placeholder"
                                placeholder="Type a topic..." autocomplete="off">
                            <button type="submit" class="cta-button">
                                <i class="fas fa-magic"></i> <span data-i18n="btnSearch">Search</span>
                            </button>
                        </div>
                    </form>
                </div>
            </main>

            <section id="results-section" class="results-grid hidden">
                <!-- Results injected here -->
            </section>
        </div>

        <!-- Explore View (Preset Content) -->
        <div id="explore-view" class="view-section hidden">
            <header class="hero-section">
                <h1 class="logo">Explore<span class="highlight">Now</span></h1>
                <p class="tagline">Curated paths for your journey.</p>

                <!-- Category Filters -->
                <div class="filter-container">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="Game">Games 🎮</button>
                    <button class="filter-btn" data-category="Fact">Facts 💡</button>
                    <button class="filter-btn" data-category="Video">Videos 🎥</button>
                </div>
            </header>
            <section id="explore-grid" class="results-grid">
                <!-- Preset content injected here -->
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
