<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnFast - Unlock Your Potential</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <main class="container">
        <header class="hero-section">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="en">EN</button>
                <button class="lang-btn" data-lang="am">AM</button>
                <button class="lang-btn" data-lang="ru">RU</button>
            </div>
            <h1 class="logo">Learn<span class="highlight">Fast</span></h1>
            <p class="tagline" data-i18n="tagline">Learn anything, faster and easier.</p>
        </header>

        <section class="search-box-container glass-card">
            <h2 data-i18n="searchTitle">What do you want to learn? (e.g. English, Java)</h2>
            <form id="learning-form" novalidate>
                <div class="input-group large-input">
                    <input type="text" id="topic" data-i18n-placeholder="placeholder"
                        placeholder="Type a topic or language..." autocomplete="off">
                    <button type="submit" class="cta-button">
                        <i class="fa-solid fa-search"></i>
                        <span data-i18n="btnSearch">Search</span>
                    </button>
                </div>
            </form>
        </section>

        <section id="results-section" class="results-grid hidden">
            <!-- Results will be injected here dynamically -->
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
